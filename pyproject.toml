[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simyuj"
version = "0.1.0"
description = "Quantum network simulator"
authors = [{ name = "SimYuj contributors" }]
license = "MIT"
license-files = ["LICENSE"]

# Support both Python 3.11 and 3.12 (and future versions)
requires-python = ">=3.11"

readme = "README.md"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "pyyaml>=6.0.3",
    "numpy>=1.26.0",
]

[tool.setuptools.package-data]
simyuj = ["py.typed"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
exclude = ["simyuj.graphify-out", "simyuj.graphify-out.*"]

[project.optional-dependencies]
dev = [
    "black>=25.12.0",
    "isort>=5.13.2",
    "flake8>=7.3.0",
    "mypy>=1.19.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "hypothesis>=6.150.0",
    "types-PyYAML",
]

docs = [
    "sphinx>=8.0",
    "sphinx-autodoc-typehints",
    "sphinxcontrib-mermaid",
    "pydata-sphinx-theme",
]

[tool.black]
line-length = 88
# Use both versions for compatibility
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".venv", "build", "dist"]

[tool.mypy]
strict = false
warn_unused_configs = true

explicit_package_bases = true
namespace_packages = true
mypy_path = ["src"]
files = ["src/simyuj"]

[mypy-yaml]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
