name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHON_CHECK_PATHS: src tests examples docs/source

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"

      - name: Run Black
        run: black $PYTHON_CHECK_PATHS --check

      - name: Run isort
        run: isort $PYTHON_CHECK_PATHS --check-only

      - name: Run Flake8
        run: flake8 $PYTHON_CHECK_PATHS

      - name: Run mypy
        run: mypy src/simyuj

      - name: Run pytest
        run: pytest -q

      - name: Build Sphinx docs
        run: |
          sphinx-build -b html docs/source docs/build/html
