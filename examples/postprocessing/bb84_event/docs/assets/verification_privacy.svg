<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">Verification and privacy amplification</title>
  <desc id="desc">Reconciled bits are verified with a Toeplitz tag, then compressed by privacy amplification after subtracting public leakage and margin terms.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .hash { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.5; }
      .key { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
      .loss { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; }
      .arrow { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .title { font: 16px sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 13px sans-serif; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="260" class="bg"/>

  <rect x="35" y="90" width="160" height="70" rx="8" class="box"/>
  <text x="115" y="118" class="title">reconciled bits</text>
  <text x="115" y="141" class="small">after Cascade</text>

  <line x1="195" y1="125" x2="260" y2="125" class="arrow"/>
  <rect x="260" y="90" width="155" height="70" rx="8" class="hash"/>
  <text x="337.5" y="118" class="title">verify.tag</text>
  <text x="337.5" y="141" class="small">Toeplitz hash</text>

  <line x1="415" y1="125" x2="480" y2="125" class="arrow"/>
  <rect x="480" y="70" width="165" height="110" rx="8" class="loss"/>
  <text x="562.5" y="100" class="title">budget</text>
  <text x="562.5" y="123" class="small">QBER margin</text>
  <text x="562.5" y="143" class="small">public leakage</text>
  <text x="562.5" y="163" class="small">security margin</text>

  <line x1="645" y1="125" x2="710" y2="125" class="arrow"/>
  <rect x="710" y="90" width="165" height="70" rx="8" class="key"/>
  <text x="792.5" y="118" class="title">final key</text>
  <text x="792.5" y="141" class="small">privacy hash</text>
</svg>
